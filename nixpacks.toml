# Nixpacks Build Configuration for MSME360 Full-Stack App
[phases.setup]
nixPkgs = ["python312", "nodejs_20"]

[phases.install]
cmds = [
  "python3 -m venv /opt/venv",
  "/opt/venv/bin/pip install --no-cache-dir -r requirements.txt",
  "npm --prefix client ci || npm --prefix client install"
]

[phases.build]
cmds = [
  "npm --prefix client run build"
]

[variables]
PATH = "/opt/venv/bin:$PATH"
PYTHONUNBUFFERED = "1"

[start]
cmd = "PORT=${PORT:-8000} && /opt/venv/bin/python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"

